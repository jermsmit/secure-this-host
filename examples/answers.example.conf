# secure-this-host answers file
#
# Use it with:   sudo sth --config answers.conf          (asks only what's missing)
#           or:  sudo sth --config answers.conf --yes    (no questions at all)
#
# The file is read as plain KEY=VALUE lines. It is never executed, and unknown
# keys are refused. A real run saves your answers to
# /var/lib/secure-this-host/answers.conf in this same format.

# Where is the server?  cloud | onprem
SERVER_TYPE=cloud

# Admin account. CREATE_ADMIN=yes creates ADMIN_USER if it doesn't exist.
CREATE_ADMIN=no
ADMIN_USER=alice
# Only for a NEW account in an unattended run (no one is there to set a password):
# ADMIN_SUDO_NOPASSWD=yes

# Public key to install for ADMIN_USER (skip if the account already has one).
# ADMIN_PUBKEY="ssh-ed25519 AAAA... alice@laptop"
# ADMIN_PUBKEY_FILE=/root/alice.pub

# Accounts allowed to log in over SSH (space-separated). ADMIN_USER is always included.
SSH_ALLOW_USERS="alice"

# openssh   = SSH keys, reachable only over Tailscale (and the LAN if allowed)
# tailscale = Tailscale SSH (identity-based); OpenSSH stays as a hardened fallback
SSH_METHOD=openssh

# Tailscale. TS_AUTHKEY_FILE is required for --yes runs on a server that isn't
# joined yet. Use a one-off, pre-approved, tagged key and delete the file afterwards.
TS_TAG=tag:server
# TS_AUTHKEY_FILE=/root/tailscale-authkey

# SSH from the local network (onprem only):  no | subnet | host
LAN_SSH=no
# LAN_SSH_SOURCE=192.168.1.0/24      # a private network, or one private IP for "host"

# Ports open to the internet, e.g. "80,443" or "443/tcp 51820/udp", or none.
PUBLIC_PORTS=none
# Remove existing ufw rules that open SSH to everyone: yes | no
REMOVE_OPEN_SSH_RULES=yes

# Security updates
AUTO_UPDATES=yes
AUTO_REBOOT=no
# AUTO_REBOOT_TIME=03:30

# Extra hardening (kernel settings, AppArmor check, audit logging)
EXTRA_HARDENING=yes
# fail2ban: yes | no | auto (auto = only when SSH is reachable from the LAN)
FAIL2BAN=auto
# Disable avahi-daemon, cups, cups-browsed, rpcbind, bluetooth if enabled
DISABLE_SERVICES=yes
# Make published Docker ports obey the firewall (only matters if Docker is installed)
DOCKER_FIREWALL=no

# Safety net
ROLLBACK_WINDOW=5            # minutes, 2-30
CONFIRM_MODE=new-session     # new-session | none (none = no test login; for cloud-init)
