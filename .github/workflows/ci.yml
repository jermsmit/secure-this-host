name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -x -S warning secure-this-host.sh lib/*.sh tests/*.sh tests/stubs/fake
      - name: Unit tests
        run: bash tests/unit.sh
      - name: Integration tests (fake system commands, no real changes)
        run: bash tests/integration.sh
